<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Clickyy AI — your private voice assistant for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="0.55" stop-color="#101114"/>
      <stop offset="1" stop-color="#16130f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a373" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#d4a373" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d4a373" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#f6dcbc" stop-opacity="0.55"/>
      <stop offset="0.28" stop-color="#6b5236"/>
      <stop offset="0.7" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </radialGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f5f4"/>
      <stop offset="0.45" stop-color="#f3d7b4"/>
      <stop offset="0.55" stop-color="#d4a373"/>
      <stop offset="1" stop-color="#f5f5f4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8ed8e8"/>
      <stop offset="1" stop-color="#d4a373"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- drifting particles -->
  <g fill="#d4a373">
    <circle cx="120" cy="80" r="1.6" opacity="0.5"><animate attributeName="cy" values="80;60;80" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="330" r="1.4" opacity="0.4"><animate attributeName="cy" values="330;305;330" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="70" r="1.2" opacity="0.45" fill="#8ed8e8"><animate attributeName="cy" values="70;95;70" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="350" r="1.3" opacity="0.4" fill="#8ed8e8"><animate attributeName="cy" values="350;330;350" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40" r="1" opacity="0.35"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orb -->
  <g transform="translate(270 210)">
    <circle r="170" fill="url(#glow)" filter="url(#blur)">
      <animate attributeName="r" values="160;178;160" dur="5s" repeatCount="indefinite"/>
    </circle>
    <g fill="none" stroke="url(#ring)" stroke-linecap="round">
      <circle r="118" stroke-width="1" opacity="0">
        <animate attributeName="r" values="96;150" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="118" stroke-width="1" opacity="0">
        <animate attributeName="r" values="96;150" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <ellipse rx="128" ry="34" stroke-width="1.2" opacity="0.55" transform="rotate(-18)">
        <animateTransform attributeName="transform" type="rotate" values="-18;342" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="128" ry="34" stroke-width="0.8" opacity="0.35" transform="rotate(62)">
        <animateTransform attributeName="transform" type="rotate" values="62;-298" dur="22s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <circle r="92" fill="url(#core)"/>
    <circle r="92" fill="none" stroke="#d4a373" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M -100 0 A 100 100 0 0 1 -40 -92" fill="none" stroke="#8ed8e8" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- voice bars -->
    <g fill="#f3d7b4" opacity="0.9" transform="translate(-26 -14)">
      <rect x="0" y="6" width="6" height="16" rx="3"><animate attributeName="height" values="16;34;12;28;16" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="6;-3;8;0;6" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="12" y="0" width="6" height="28" rx="3"><animate attributeName="height" values="28;14;36;20;28" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="0;7;-4;4;0" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="24" y="4" width="6" height="20" rx="3"><animate attributeName="height" values="20;38;16;30;20" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="4;-5;6;-1;4" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="36" y="2" width="6" height="24" rx="3"><animate attributeName="height" values="24;12;30;18;24" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="2;8;-1;5;2" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="48" y="7" width="6" height="14" rx="3"><animate attributeName="height" values="14;26;10;22;14" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="7;1;9;3;7" dur="1.5s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="520" y="150" font-size="18" letter-spacing="8" fill="#d4a373" font-weight="600">VOICE · OFFLINE · PRIVATE</text>
    <text x="516" y="232" font-size="96" font-weight="700" letter-spacing="10" fill="url(#word)">CLICKYY</text>
    <text x="522" y="278" font-size="24" fill="#c9cbd0">Your AI that listens, speaks and runs your PC.</text>
    <text x="522" y="312" font-size="18" fill="#969aa3">Claude · Gemini · GPT · Grok · Llama · 300+ models · fully local mode</text>
    <g transform="translate(522 340)">
      <rect width="196" height="36" rx="18" fill="#d4a373" fill-opacity="0.12" stroke="#d4a373" stroke-opacity="0.6"/>
      <circle cx="22" cy="18" r="5" fill="#8ed8e8"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="36" y="24" font-size="15" fill="#f3d7b4">“Hey Clickyy…”</text>
    </g>
  </g>
</svg>
